name: Runtime native Windows verification
on:
    workflow_dispatch:
    push:
        branches: [codex/veriq-mvp-completion]
        paths:
            - .github/workflows/runtime-native.yml
            - apps/runtime/**
            - packages/**
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
permissions:
    contents: read
jobs:
    windows-native:
        runs-on: windows-2025
        timeout-minutes: 25
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
            VERIQ_NATIVE_EVIDENCE: ${{ github.workspace }}/.superpowers/sdd/veriq-1/evidence/t20/native-${{ github.sha }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.22.1
            - name: Record actual OS identity and initial disk budget
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force $env:VERIQ_NATIVE_EVIDENCE | Out-Null
                  $driveName = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
                  $free = (Get-PSDrive -Name $driveName).Free
                  $os = Get-CimInstance Win32_OperatingSystem
                  $record = @{ source = $env:GITHUB_SHA; node = (& node --version); productName = $os.Caption; version = $os.Version; build = $os.BuildNumber; arch = $os.OSArchitecture; freeBytes = $free; acceptance = 'Windows Server native test; not Windows 11 GUI acceptance' }
                  $record | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'environment.json')
                  if ($free -lt 12GB) { throw 'NATIVE_BUILD_DISK_BUDGET_REQUIRED' }
            - name: Install pinned tools and frozen JavaScript dependencies
              shell: pwsh
              run: |
                  npm install --prefix "$env:RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  $pnpm = Join-Path $env:RUNNER_TEMP 'veriq-node-tools/node_modules/pnpm/bin/pnpm.cjs'
                  node $pnpm install --frozen-lockfile --ignore-scripts
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Build native guardian and Node-API adapter with pinned build graph
              shell: pwsh
              working-directory: apps/runtime
              run: |
                  $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
                  & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | Set-Content -Encoding utf8 (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'visual-studio.json')
                  python --version 2>&1 | Tee-Object -FilePath (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'python-version.log')
                  $headers = Join-Path $env:RUNNER_TEMP 'veriq-node-headers'
                  node scripts/build-windows.mjs "$headers" --test-schedules 2>&1 | Tee-Object -FilePath (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'native-build.log')
                  exit $LASTEXITCODE
            - name: Observe actual Windows lifecycle and private transport behavior
              shell: pwsh
              working-directory: apps/runtime
              run: |
                  node --import tsx --test tests/native/windows.test.ts tests/native/windows-scheduling.test.ts tests/native/windows-constructor.test.ts tests/native/windows-response-close.test.ts tests/pipe-framing.test.ts 2>&1 | Tee-Object -FilePath (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'windows-native.log')
                  exit $LASTEXITCODE
            - name: Preserve source binding and final disk observation
              if: always()
              shell: pwsh
              run: |
                  $driveName = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
                  $free = (Get-PSDrive -Name $driveName).Free
                  $files = git ls-files apps/runtime packages pnpm-lock.yaml .github/workflows/runtime-native.yml
                  $hashes = @{}
                  foreach ($file in $files) { $hashes[$file] = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() }
                  $nativeInputs = @{}
                  $nativeRoots = @((Join-Path $env:RUNNER_TEMP 'veriq-node-headers'), (Join-Path $env:GITHUB_WORKSPACE 'apps/runtime/build'), (Join-Path $env:GITHUB_WORKSPACE 'apps/runtime/native/build'), (Join-Path $env:GITHUB_WORKSPACE 'apps/runtime/node_modules/node-addon-api'))
                  foreach ($root in $nativeRoots) {
                    if (Test-Path $root) { Get-ChildItem -Path $root -File -Recurse | ForEach-Object { $nativeInputs[$_.FullName] = @{ sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(); bytes = $_.Length } } }
                  }
                  # 只采集本次自有项目生成后的实际宏和异常处理设置，并限制文件数与字节量，避免把请求的编译选项当成真实配置；证据先落盘，再拒绝继承 STL 无异常模式或缺失设置的构建。
                  $projectSettings = @()
                  $projectRoot = Join-Path $env:GITHUB_WORKSPACE 'apps/runtime/native/build'
                  $projects = @(Get-ChildItem -Path $projectRoot -Filter 'veriq_*.vcxproj' -File -ErrorAction SilentlyContinue)
                  if ($projects.Count -gt 16) { throw 'NATIVE_PROJECT_EVIDENCE_LIMIT' }
                  foreach ($projectFile in $projects) {
                      if ($projectFile.Length -gt 256KB) { throw 'NATIVE_PROJECT_EVIDENCE_LIMIT' }
                      [xml]$project = Get-Content -Raw $projectFile.FullName
                      foreach ($group in $project.SelectNodes("//*[local-name()='ItemDefinitionGroup']")) {
                          $compile = $group.SelectSingleNode("*[local-name()='ClCompile']")
                          if ($null -eq $compile) { continue }
                          $defines = $compile.SelectSingleNode("*[local-name()='PreprocessorDefinitions']")
                          $exceptions = $compile.SelectSingleNode("*[local-name()='ExceptionHandling']")
                          $projectSettings += @{ project = $projectFile.Name; condition = $group.GetAttribute('Condition'); preprocessorDefinitions = $defines.InnerText; exceptionHandling = $exceptions.InnerText }
                      }
                  }
                  @{ source = $env:GITHUB_SHA; expected = @{ stlExceptions = '_HAS_EXCEPTIONS=1'; exceptionHandling = 'Sync' }; projects = $projectSettings } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'exception-settings.json')
                  $nodePath = (Get-Command node).Source
                  $nativeInputs[$nodePath] = @{ sha256 = (Get-FileHash -Algorithm SHA256 $nodePath).Hash.ToLowerInvariant(); bytes = (Get-Item $nodePath).Length }
                  @{ source = $env:GITHUB_SHA; files = $hashes; finalFreeBytes = $free; phase = 'native-guardian-pipe-first-target-build'; nativeInputs = $nativeInputs } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $env:VERIQ_NATIVE_EVIDENCE 'source-binding.json')
                  if ($projectSettings.Count -eq 0) { throw 'NATIVE_PROJECT_EVIDENCE_MISSING' }
                  foreach ($settings in $projectSettings) {
                      $definitions = $settings.preprocessorDefinitions.Split(';')
                      if ($definitions -contains '_HAS_EXCEPTIONS=0' -or $definitions -notcontains '_HAS_EXCEPTIONS=1' -or $settings.exceptionHandling -ne 'Sync') { throw 'NATIVE_EXCEPTION_SETTINGS_INVALID' }
                  }
                  if ($free -lt 2GB) { throw 'NATIVE_BUILD_DISK_RESERVE_EXHAUSTED' }
            - name: Upload native observations even when tests fail
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: runtime-native-${{ github.sha }}
                  path: |
                      .superpowers/sdd/veriq-1/evidence/t20/native-${{ github.sha }}/*.json
                      .superpowers/sdd/veriq-1/evidence/t20/native-${{ github.sha }}/*.log
                  include-hidden-files: true
                  if-no-files-found: warn
