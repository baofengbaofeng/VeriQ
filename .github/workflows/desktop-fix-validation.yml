name: Desktop focused verification
on:
    workflow_dispatch:
    push:
        branches: [codex/veriq-mvp-completion]
        paths:
            - .github/workflows/desktop-fix-validation.yml
            - apps/desktop/**
            - apps/runtime/**
            - apps/web/**
            - apps/srv/**
            - packages/**
            - tests/e2e/**
            - scripts/build_engine.mts
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - package.json
permissions:
    contents: read
jobs:
    ubuntu-desktop:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.superpowers/cache/playwright
            VERIQ_DESKTOP_EVIDENCE: ${{ github.workspace }}/.superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}
        services:
            mysql:
                image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
                env:
                    MYSQL_ROOT_PASSWORD: veriq-ci-only
                    MYSQL_DATABASE: veriq_test
                ports: ["13306:3306"]
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s --health-timeout=5s --health-retries=12
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
              with:
                  python-version: 3.12.14
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.22.1
            - name: Install pinned build tools
              run: |
                  python -m pip install --target "$RUNNER_TEMP/veriq-python-tools" uv==0.13.5
                  npm install --prefix "$RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts
                  echo "$RUNNER_TEMP/veriq-python-tools/bin" >> "$GITHUB_PATH"
                  echo "$RUNNER_TEMP/veriq-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
            - name: Prepare locked dependencies and actual matched browsers
              run: |
                  mkdir -p "$VERIQ_DESKTOP_EVIDENCE"
                  uv sync --project apps/srv --frozen --all-groups
                  pnpm install --frozen-lockfile
                  pnpm --filter @veriq/runner-sdk exec playwright install --with-deps chromium
                  sudo apt-get install --yes --no-install-recommends xvfb xauth x11-utils imagemagick libxtst6
                  pnpm --filter @veriq/desktop exec node <<'JS'
                  // 首次解析成熟依赖可能向标准输出写下载诊断，因此只通过文件接口写入验证过的可执行路径；两项都校验成功后才追加环境记录，日志不能被当成 GitHub 环境文件语法解析。
                  const fs = require('node:fs');
                  const path = require('node:path');
                  const environmentFile = process.env.GITHUB_ENV;
                  if (!environmentFile || !path.isAbsolute(environmentFile)) throw new Error('GITHUB_ENV_PATH_REQUIRED');
                  const binaries = [
                      ['VERIQ_TEST_ELECTRON', require('electron')],
                      ['VERIQ_TEST_HEADED_BROWSER', require('playwright-core').chromium.executablePath()],
                  ];
                  const lines = binaries.map(([key, value]) => {
                      if (typeof value !== 'string' || !path.isAbsolute(value) || Array.from(value).some(character => character.charCodeAt(0) < 32 || character.charCodeAt(0) === 127)) throw new Error('INVALID_TEST_BINARY_PATH');
                      const actual = fs.realpathSync(value);
                      if (Array.from(actual).some(character => character.charCodeAt(0) < 32 || character.charCodeAt(0) === 127)) throw new Error('INVALID_TEST_BINARY_PATH');
                      if (!fs.statSync(actual).isFile()) throw new Error('TEST_BINARY_NOT_FILE');
                      fs.accessSync(actual, fs.constants.X_OK);
                      return `${key}=${actual}`;
                  });
                  fs.appendFileSync(environmentFile, lines.join('\n') + '\n');
                  JS
            - name: Produce a separate unapproved current-source candidate
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/contracts exec tsx ../../scripts/build_engine.mts "1.0.3-t20-${GITHUB_SHA}" "$GITHUB_WORKSPACE/work/t20-ci-engine-${GITHUB_SHA}" | tee "$VERIQ_DESKTOP_EVIDENCE/engine-producer.log"
                  python - <<'PY'
                  import hashlib, json, os, subprocess
                  from pathlib import Path
                  root = Path.cwd()
                  evidence = Path(os.environ['VERIQ_DESKTOP_EVIDENCE'])
                  produced = json.loads((evidence / 'engine-producer.log').read_text().splitlines()[-1])
                  assert produced['engineVersion'] == '1.0.3-t20-' + os.environ['GITHUB_SHA']
                  candidate = root / ('work/t20-ci-engine-' + os.environ['GITHUB_SHA'])
                  assert Path(produced['output']) == candidate
                  inventory_raw = (candidate / 'inventory.json').read_bytes()
                  (evidence / 'candidate-inventory.json').write_bytes(inventory_raw)
                  paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
                  binding = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'status': 'UNAPPROVED_TEST_CANDIDATE', 'production': produced, 'sourceSha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in paths if name and (root / name).is_file()}, 'inventoryRawSha256': hashlib.sha256((candidate / 'inventory.json').read_bytes()).hexdigest()}
                  (evidence / 'source-production-binding.json').write_text(json.dumps(binding, indent=4) + '\n')
                  with open(os.environ['GITHUB_ENV'], 'a') as handle:
                      handle.write(f"VERIQ_TEST_ENGINE_DIRECTORY={candidate}\nVERIQ_TEST_ENGINE_VERSION={produced['engineVersion']}\nVERIQ_TEST_ENGINE_HASH={produced['inventoryHash']}\n")
                  settings = root / '.superpowers/sdd/veriq-1/test-env.json'
                  settings.write_text(json.dumps({'mysql_dsn': 'mysql+asyncmy://root:veriq-ci-only@127.0.0.1:13306/veriq_test'}))
                  settings.chmod(0o600)
                  PY
            - name: Build desktop and verify affected boundaries
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/desktop build 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/desktop-build.log"
                  pnpm check 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/check.log"
                  pnpm --filter @veriq/desktop test:unit 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/unit.log"
                  pnpm --filter @veriq/runtime exec node --import tsx --test tests/display-environment.test.ts 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/display-environment.log"
                  python - <<'PY'
                  import hashlib, json, os, subprocess
                  from pathlib import Path
                  root = Path.cwd()
                  files = [path for directory in ['apps/desktop/out', 'apps/web/dist-desktop'] for path in (root / directory).rglob('*') if path.is_file()]
                  files.append(root / 'apps/desktop/build/veriq_runner')
                  binding = {'head': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'node': subprocess.check_output(['node', '--version']).decode().strip(), 'fullChrome': subprocess.check_output([os.environ['VERIQ_TEST_HEADED_BROWSER'], '--version']).decode().strip(), 'compiledSha256': {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(files)}}
                  (Path(os.environ['VERIQ_DESKTOP_EVIDENCE']) / 'compiled-binding.json').write_text(json.dumps(binding, indent=4) + '\n')
                  PY
            - name: Allow user namespaces only for this hosted job's exact test binaries
              env:
                  VERIQ_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
              run: |
                  set -o pipefail
                  python tests/e2e/test_ci_userns.py 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/userns-boundary-tests.log"
                  python tests/e2e/ci_userns.py prepare
            - name: Verify affected Runtime behavior with the actual matched browser
              timeout-minutes: 5
              run: |
                  set -o pipefail
                  test -x apps/runtime/build/veriq_runner
                  pnpm --filter @veriq/runtime exec node --import tsx --test tests/runtime.test.ts tests/renewal.test.ts tests/distribution.test.ts tests/offline-store.test.ts tests/supervisor.test.ts tests/vault-envelope.test.ts 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/runtime-affected.log"
            - name: Run the composed actual GUI suite with visible Chromium acceptance
              env:
                  DEBUG: pw:browser
              run: |
                  set -o pipefail
                  xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' pnpm desktop:test 2>&1 | tee "$VERIQ_DESKTOP_EVIDENCE/desktop-composed.log"
                  python - <<'PY'
                  import json, os
                  from pathlib import Path
                  evidence = Path(os.environ['VERIQ_DESKTOP_EVIDENCE'])
                  observed = json.loads((evidence / 'headed-observation.json').read_bytes())
                  stopped = json.loads((evidence / 'headed-stopped.json').read_bytes())
                  results = json.loads((evidence / 'gui-results.json').read_bytes())
                  assert observed['mode'] == 'headed' and observed['browserVersion'] == '158.0.8127.18'
                  assert observed['mapState'] == 'IsViewable'
                  assert stopped['attemptId'] == observed['attemptId']
                  assert stopped['processStopped'] is True and stopped['journalState'] == 'STOPPED'
                  assert stopped['windowGone'] is True and stopped['ownedPidsExited'] is True
                  stats = results['stats']
                  assert stats['expected'] == 6 and stats['unexpected'] == 0 and stats['skipped'] == 0 and stats['flaky'] == 0
                  print('Composed GUI acceptance verified: 6 passed, 0 skipped; actual headed window and stop observations present')
                  PY
            - name: Remove only this job's temporary user namespace profiles
              if: always()
              env:
                  VERIQ_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
              run: python tests/e2e/ci_userns.py cleanup
            - name: Preserve public observations and diagnostics
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: desktop-t20-${{ github.sha }}
                  include-hidden-files: true
                  path: |
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/*.log
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/*.png
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/headed-*.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/gui-results.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/source-production-binding.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/candidate-inventory.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/compiled-binding.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/userns-*.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/userns-*.jsonl
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/userns-*.profile
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/gui-runtime-versions.json
                      .superpowers/sdd/veriq-1/evidence/t20/desktop-${{ github.sha }}/playwright-results/**/error-context.md
                  if-no-files-found: warn
