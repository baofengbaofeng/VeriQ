name: Server release verification
on:
    workflow_dispatch:
        inputs:
            purpose:
                description: Verification purpose (web modes never release)
                type: choice
                default: release
                options: [release, web-components, web-full]
            source_ref:
                description: Exact lowercase 40-character dispatch commit for web modes
                type: string
                required: false
    push:
        branches: [main, master, codex/veriq-mvp-completion]
    pull_request:
permissions:
    contents: read
jobs:
    admission:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            purpose: ${{ steps.mode.outputs.purpose }}
        steps:
            - name: Admit an exact event, purpose and source
              id: mode
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_PURPOSE: ${{ inputs.purpose }}
                  REQUESTED_SOURCE: ${{ inputs.source_ref }}
              shell: bash
              run: |
                  set -euo pipefail
                  case "$EVENT_NAME" in
                      push|pull_request) purpose=release ;;
                      workflow_dispatch)
                          case "$REQUESTED_PURPOSE" in
                              release) purpose=release ;;
                              web-components|web-full)
                                  [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
                                  [[ "$REQUESTED_SOURCE" == "$GITHUB_SHA" ]] || exit 1
                                  purpose="$REQUESTED_PURPOSE"
                                  ;;
                              *) echo 'Unknown verification purpose' >&2; exit 1 ;;
                          esac
                          ;;
                      *) echo 'Unsupported workflow event' >&2; exit 1 ;;
                  esac
                  echo "purpose=$purpose" >> "$GITHUB_OUTPUT"
    ubuntu-release:
        needs: admission
        if: needs.admission.outputs.purpose == 'release'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        services:
            mysql:
                image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
                env:
                    MYSQL_ROOT_PASSWORD: veriq-ci-only
                    MYSQL_DATABASE: veriq_test
                ports: ["13306:3306"]
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s --health-timeout=5s --health-retries=12
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
              with:
                  python-version: 3.12.14
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.x
            - name: Install pinned build tools into runner temporary directories
              run: |
                  python -m pip install --target "$RUNNER_TEMP/veriq-python-tools" uv==0.13.5
                  npm install --prefix "$RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts
                  echo "$RUNNER_TEMP/veriq-python-tools/bin" >> "$GITHUB_PATH"
                  echo "$RUNNER_TEMP/veriq-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
            - name: Prepare isolated test inputs and matched browsers
              run: |
                  uv sync --project apps/srv --frozen --all-groups
                  pnpm install --frozen-lockfile
                  pnpm --filter @veriq/runner-sdk exec playwright install --with-deps chromium
                  mkdir -p .superpowers/sdd/veriq-1/state
                  python - <<'PY'
                  import json, os
                  from pathlib import Path
                  root = Path.cwd()
                  path = root / '.superpowers/sdd/veriq-1/test-env.json'
                  path.write_text(json.dumps({'mysql_dsn': 'mysql+asyncmy://root:veriq-ci-only@127.0.0.1:13306/veriq_test', 'approved_engine_inventory_path': str(root / '.superpowers/sdd/veriq-1/state/approved-engine-inventory.json')}))
                  path.chmod(0o600)
                  PY
                  node apps/web/tests/prepare-editor-agent.mjs
                  cp .superpowers/cache/t11/release/inventory.json .superpowers/sdd/veriq-1/state/approved-engine-inventory.json
            - name: Full normal release
              run: ./build.sh
            - name: Reject emergency artifacts in normal release CI
              run: |
                  python - <<'PY'
                  import json
                  from pathlib import Path
                  release = json.loads(Path('output/server/release.json').read_bytes())
                  assert release['status'] == 'VERIFIED'
                  assert release['testsSkipped'] is False
                  PY
            - name: Independently build and start the pinned control image
              run: |
                  docker build -f output/server/deploy/Dockerfile -t veriq-control:test output/server
                  mkdir -p work/container-config
                  python - <<'PY'
                  import json
                  from pathlib import Path
                  path = Path('work/container-config/veriq.json')
                  path.write_text(json.dumps({'database_url': 'mysql+asyncmy://unused:unused@127.0.0.1:1/veriq_unused', 'public_url': 'https://veriq.example.com', 'host': '0.0.0.0', 'master_key': 'a' * 64, 'signing_key': 'b' * 64, 'artifact_directory': '/var/lib/veriq/artifacts'}))
                  path.chmod(0o644)
                  PY
                  docker run --detach --name veriq-control-test --read-only --tmpfs /tmp --tmpfs /var/lib/veriq:uid=10001,gid=10001 -v "$PWD/work/container-config:/etc/veriq:ro" -p 18888:8888 veriq-control:test
                  python scripts/probe_container.py
                  docker exec veriq-control-test python -c "import shutil; assert all(shutil.which(x) is None for x in ('node', 'chromium', 'google-chrome'))"
            - name: Preserve evidence even when a real gate fails
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: server-release-evidence
                  path: |
                      work/release-*/commands.json
                      work/release-*/processes.json
                      work/release-*/cancellation.json
                      work/release-*/child-*.json
                      work/build-unsafe.json
                      work/release-*/*.log
                      work/release-*/source-binding.json
                      work/release-*/comment-audit.json
                      output/server/**
                  if-no-files-found: error
            - name: Stop candidate container
              if: always()
              run: docker rm -f veriq-control-test || test "$(docker ps -aq --filter name=veriq-control-test)" = ""
    web-components:
        needs: admission
        if: contains(fromJSON('["web-components", "web-full"]'), needs.admission.outputs.purpose)
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            VERIQ_WEB_EVIDENCE: ${{ github.workspace }}/.superpowers/cache/r02-web-components
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - name: Verify checkout identity before source installation or execution
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
                  mkdir -p "$VERIQ_WEB_EVIDENCE"
                  printf '{"source":"%s","run":"%s","attempt":"%s"}\n' \
                      "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$VERIQ_WEB_EVIDENCE/source.json"
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.x
            - name: Install the fixed pnpm tool
              run: |
                  npm install --prefix "$RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts
                  echo "$RUNNER_TEMP/veriq-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
            - name: Install frozen Node dependencies without unrelated binary downloads
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
              run: |
                  set -o pipefail
                  pnpm install --frozen-lockfile 2>&1 | tee "$VERIQ_WEB_EVIDENCE/node-install.log"
            - name: Install the locked Playwright Chromium with system dependencies
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web exec playwright install --with-deps chromium \
                      2>&1 | tee "$VERIQ_WEB_EVIDENCE/browser-install.log"
            - name: Record source, lock and actual matched browser identity
              run: |
                  pnpm --filter @veriq/web exec node --input-type=module <<'JS'
                  import { createHash } from "node:crypto";
                  import { readFileSync, writeFileSync } from "node:fs";
                  import { execFileSync } from "node:child_process";
                  import { join } from "node:path";
                  import { chromium } from "@playwright/test";
                  const root = execFileSync("git", ["rev-parse", "--show-toplevel"], { encoding: "utf8" }).trim();
                  const sha256 = (name) => createHash("sha256").update(readFileSync(join(root, name))).digest("hex");
                  const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
                  if (head !== process.env.GITHUB_SHA) throw new Error("SOURCE_IDENTITY_MISMATCH");
                  const files = execFileSync("git", ["ls-files", "-z"], { cwd: root, encoding: "utf8" })
                      .split("\0").filter(Boolean);
                  const playwright = JSON.parse(readFileSync(join(root, "apps/web/package.json"), "utf8"));
                  if (playwright.devDependencies["@playwright/test"] !== "1.65.0") {
                      throw new Error("PLAYWRIGHT_PIN_MISMATCH");
                  }
                  const browser = chromium.executablePath();
                  const identity = {
                      source: head,
                      run: process.env.GITHUB_RUN_ID,
                      attempt: process.env.GITHUB_RUN_ATTEMPT,
                      node: process.version,
                      pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
                      playwright: "1.65.0",
                      browser: execFileSync(browser, ["--version"], { encoding: "utf8" }).trim(),
                      locks: { node: sha256("pnpm-lock.yaml"), python: sha256("apps/srv/uv.lock") },
                      sourceSha256: Object.fromEntries(files.map((name) => [name, sha256(name)])),
                  };
                  const identityPath = join(process.env.VERIQ_WEB_EVIDENCE, "identity.json");
                  writeFileSync(identityPath, JSON.stringify(identity, null, 4) + "\n");
                  JS
            - name: Run actual component interactions with the matched browser
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web exec playwright test --config playwright.interactions.config.ts \
                      2>&1 | tee "$VERIQ_WEB_EVIDENCE/interactions.log"
            - name: Always retain this scope's bounded public test evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: r02-web-components-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  retention-days: 7
                  include-hidden-files: true
                  path: |
                      .superpowers/cache/r02-web-components/*.json
                      .superpowers/cache/r02-web-components/*.log
                      .superpowers/cache/r02-web-components/*.xml
                      .superpowers/cache/r02-web-components/results/**
                  if-no-files-found: error
    web-full:
        needs: admission
        if: needs.admission.outputs.purpose == 'web-full'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            VERIQ_WEB_EVIDENCE: ${{ github.workspace }}/.superpowers/cache/r02-web-full
            PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/.superpowers/cache/r02-web-full/junit.xml
        services:
            mysql:
                image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
                env:
                    MYSQL_ROOT_PASSWORD: veriq-ci-only
                    MYSQL_DATABASE: veriq_test
                ports: ["13306:3306"]
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=10s --health-timeout=5s --health-retries=12
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              with:
                  persist-credentials: false
            - name: Verify checkout identity before source installation or execution
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
                  mkdir -p "$VERIQ_WEB_EVIDENCE"
                  printf '{"source":"%s","run":"%s","attempt":"%s"}\n' \
                      "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$VERIQ_WEB_EVIDENCE/source.json"
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
              with:
                  python-version: 3.12.14
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.x
            - name: Install the fixed pnpm tool
              run: |
                  npm install --prefix "$RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts
                  echo "$RUNNER_TEMP/veriq-node-tools/node_modules/.bin" >> "$GITHUB_PATH"
            - name: Install the fixed uv tool and frozen Python dependencies
              run: |
                  set -o pipefail
                  python -m pip install --target "$RUNNER_TEMP/veriq-python-tools" uv==0.13.5
                  echo "$RUNNER_TEMP/veriq-python-tools/bin" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/veriq-python-tools/bin/uv" sync --project apps/srv --frozen --all-groups \
                      2>&1 | tee "$VERIQ_WEB_EVIDENCE/python-install.log"
            - name: Install frozen Node dependencies without unrelated binary downloads
              env:
                  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
              run: |
                  set -o pipefail
                  pnpm install --frozen-lockfile 2>&1 | tee "$VERIQ_WEB_EVIDENCE/node-install.log"
            - name: Install the locked Playwright Chromium with system dependencies
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web exec playwright install --with-deps chromium \
                      2>&1 | tee "$VERIQ_WEB_EVIDENCE/browser-install.log"
            - name: Record source, lock and actual matched browser identity
              run: |
                  pnpm --filter @veriq/web exec node --input-type=module <<'JS'
                  import { createHash } from "node:crypto";
                  import { readFileSync, writeFileSync } from "node:fs";
                  import { execFileSync } from "node:child_process";
                  import { join } from "node:path";
                  import { chromium } from "@playwright/test";
                  const root = execFileSync("git", ["rev-parse", "--show-toplevel"], { encoding: "utf8" }).trim();
                  const sha256 = (name) => createHash("sha256").update(readFileSync(join(root, name))).digest("hex");
                  const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
                  if (head !== process.env.GITHUB_SHA) throw new Error("SOURCE_IDENTITY_MISMATCH");
                  const files = execFileSync("git", ["ls-files", "-z"], { cwd: root, encoding: "utf8" })
                      .split("\0").filter(Boolean);
                  const playwright = JSON.parse(readFileSync(join(root, "apps/web/package.json"), "utf8"));
                  if (playwright.devDependencies["@playwright/test"] !== "1.65.0") {
                      throw new Error("PLAYWRIGHT_PIN_MISMATCH");
                  }
                  const browser = chromium.executablePath();
                  const identity = {
                      source: head,
                      run: process.env.GITHUB_RUN_ID,
                      attempt: process.env.GITHUB_RUN_ATTEMPT,
                      node: process.version,
                      pnpm: execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(),
                      playwright: "1.65.0",
                      browser: execFileSync(browser, ["--version"], { encoding: "utf8" }).trim(),
                      locks: { node: sha256("pnpm-lock.yaml"), python: sha256("apps/srv/uv.lock") },
                      sourceSha256: Object.fromEntries(files.map((name) => [name, sha256(name)])),
                  };
                  const identityPath = join(process.env.VERIQ_WEB_EVIDENCE, "identity.json");
                  writeFileSync(identityPath, JSON.stringify(identity, null, 4) + "\n");
                  JS
            - name: Prepare private synthetic database and test-only engine inventory
              id: ready
              run: |
                  set -o pipefail
                  umask 077
                  mkdir -p .superpowers/sdd/veriq-1/state
                  python - <<'PYTHON'
                  import json
                  from pathlib import Path
                  root = Path.cwd()
                  path = root / '.superpowers/sdd/veriq-1/test-env.json'
                  path.write_text(json.dumps({
                      'mysql_dsn': 'mysql+asyncmy://root:veriq-ci-only@127.0.0.1:13306/veriq_test',
                      'approved_engine_inventory_path': str(
                          root / '.superpowers/sdd/veriq-1/state/approved-engine-inventory.json'
                      ),
                  }))
                  path.chmod(0o600)
                  PYTHON
                  node apps/web/tests/prepare-editor-agent.mjs 2>&1 | tee "$VERIQ_WEB_EVIDENCE/test-engine.log"
                  cp .superpowers/cache/t11/release/inventory.json \
                      .superpowers/sdd/veriq-1/state/approved-engine-inventory.json
                  printf '%s\n' 'TEST_ONLY_ENGINE_INVENTORY; NOT_DISTRIBUTION_ACCEPTANCE' \
                      > "$VERIQ_WEB_EVIDENCE/test-engine-status.log"
            - name: Run the complete existing Web browser suite
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web exec playwright test --config playwright.config.ts \
                      --output ../../.superpowers/cache/r02-web-full/results \
                      --reporter list,junit --trace retain-on-failure --max-failures=5 \
                      2>&1 | tee "$VERIQ_WEB_EVIDENCE/web-e2e.log"
            - name: Run Web recovery and protocol unit regressions
              timeout-minutes: 2
              if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web test:unit 2>&1 | tee "$VERIQ_WEB_EVIDENCE/unit.log"
            - name: Check Web types, lint and formatting
              if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web check 2>&1 | tee "$VERIQ_WEB_EVIDENCE/web-check.log"
            - name: Build Web with the existing production entry
              if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
              run: |
                  set -o pipefail
                  pnpm --filter @veriq/web build 2>&1 | tee "$VERIQ_WEB_EVIDENCE/web-build.log"
            - name: Always retain this scope's bounded public test evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: r02-web-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
                  retention-days: 7
                  include-hidden-files: true
                  path: |
                      .superpowers/cache/r02-web-full/*.json
                      .superpowers/cache/r02-web-full/*.log
                      .superpowers/cache/r02-web-full/*.xml
                      .superpowers/cache/r02-web-full/results/**
                  if-no-files-found: error
