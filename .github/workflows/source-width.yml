name: Check source line width
on: pull_request
permissions:
    contents: read

jobs:
    width:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - run: python3 scripts/line_width.py
