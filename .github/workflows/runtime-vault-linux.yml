name: Observe Linux runtime vault
on: workflow_dispatch
permissions:
  contents: read

jobs:
  vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: apps/runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prepare the private evidence directory
        run: |
          umask 077
          directory=$(mktemp -d "$RUNNER_TEMP/veriq-vault-evidence.XXXXXXXX")
          echo "VERIQ_VAULT_EVIDENCE=$directory" >> "$GITHUB_ENV"
      - name: Install locked workspace and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc libc6-dev pkg-config binutils libsecret-1-dev libglib2.0-bin gnome-keyring dbus
          corepack pnpm --filter '@veriq/runtime...' install --frozen-lockfile
      - name: Record system and source inputs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$GITHUB_SHA" -- ../..
          node scripts/vault-linux-evidence.mjs packages
      - name: Build production helper and separate test driver
        run: |
          node scripts/build-vault-linux.mjs
          node scripts/build-vault-linux.mjs --test-driver
      - name: Exercise an isolated Secret Service
        run: node --import tsx --test tests/native/linux-vault.test.ts
      - name: Verify cleanup and final source binding
        if: always() && env.VERIQ_VAULT_EVIDENCE != ''
        run: |
          node scripts/vault-linux-evidence.mjs cleanup
          node scripts/vault-linux-evidence.mjs source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.VERIQ_VAULT_EVIDENCE != ''
        with:
          name: linux-private-vault-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VERIQ_VAULT_EVIDENCE }}/system-packages.json
            ${{ env.VERIQ_VAULT_EVIDENCE }}/source-binding.json
            ${{ env.VERIQ_VAULT_EVIDENCE }}/vault-*.json
            ${{ env.VERIQ_VAULT_EVIDENCE }}/vault-*.log
            ${{ env.VERIQ_VAULT_EVIDENCE }}/real-vault-observations.json
            ${{ env.VERIQ_VAULT_EVIDENCE }}/always-cleanup.json
          if-no-files-found: error
