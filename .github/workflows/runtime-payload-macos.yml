                  JS
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              id: metadata_upload
              if: always() && steps.collect.outputs.ready == 'true' && steps.collect.outputs.upload_root == format('{0}/upload', env.ASSET_ROOT)
              with:
                  name: veriq-macos-assets-observation-${{ matrix.arch }}
                  path: ${{ env.ASSET_ROOT }}/upload/
                  retention-days: 7
                  if-no-files-found: error
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              id: archives_upload
              if: steps.observe.outcome == 'success'
              with:
                  name: veriq-macos-assets-archives-${{ matrix.arch }}
                  path: ${{ env.ASSET_ROOT }}/observation/observed/snapshots/
                  compression-level: 0
                  retention-days: 7
                  if-no-files-found: error
            - name: Record artifact identity matrix for independent review
              if: always()
              env:
                  COLLECTION_STATE: ${{ steps.collect.outputs.collection }}
                  METADATA_ID: ${{ steps.metadata_upload.outputs.artifact-id }}
                  ARCHIVES_ID: ${{ steps.archives_upload.outputs.artifact-id }}
                  METADATA_DIGEST: ${{ steps.metadata_upload.outputs.artifact-digest }}
                  ARCHIVES_DIGEST: ${{ steps.archives_upload.outputs.artifact-digest }}
              shell: bash
              run: |
                  printf '%s\n' "OBSERVATION_ONLY source=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT arch=$EXPECTED_ARCH collection=$COLLECTION_STATE metadata=$METADATA_ID metadataDigest=$METADATA_DIGEST archives=$ARCHIVES_ID archivesDigest=$ARCHIVES_DIGEST" >> "$GITHUB_STEP_SUMMARY"
