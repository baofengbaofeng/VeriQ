name: Runtime private macOS files verification
on:
    workflow_dispatch:
        inputs:
            private_store_acceptance:
                description: Accept Runtime private Keychain storage in a dedicated disposable hosted account
                type: boolean
                default: false
            session_preflight:
                description: Observe read-only VeriQ security session facts without persistent acceptance
                type: boolean
                default: false
            vault_baseline:
                description: Run the reproducible nonpersistent D1 parser failure baseline
                type: boolean
                default: false
    push:
        branches: [codex/veriq-mvp-completion]
        paths:
            - .github/workflows/runtime-native-macos.yml
            - apps/runtime/**
            - packages/**
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
permissions:
    contents: read
jobs:
    # 三种显式手动目的共用唯一的有限路由检查，冲突输入必须先让本任务失败再阻止所有检出和构建；普通推送始终进入原有无专用存储授权的任务，不继承手动持久测试选择。
    macos-mode-guard:
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        outputs:
            mode: ${{ steps.mode.outputs.mode }}
        steps:
            - id: mode
              name: Reject conflicting purposes before checkout
              env:
                  VERIQ_EVENT: ${{ github.event_name }}
                  VERIQ_PREFLIGHT: ${{ inputs.session_preflight || false }}
                  VERIQ_BASELINE: ${{ inputs.vault_baseline || false }}
                  VERIQ_PRIVATE: ${{ inputs.private_store_acceptance || false }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "$VERIQ_EVENT" = push ]; then
                      mode=ordinary
                  elif [ "$VERIQ_EVENT" = workflow_dispatch ]; then
                      case "$VERIQ_PREFLIGHT:$VERIQ_BASELINE:$VERIQ_PRIVATE" in
                          false:false:false) mode=ordinary ;;
                          true:false:false) mode=preflight ;;
                          false:true:false) mode=baseline ;;
                          false:false:true) mode=private ;;
                          *) printf '%s\n' MAC_PURPOSE_CONFLICT >&2; exit 1 ;;
                      esac
                  else
                      printf '%s\n' MAC_EVENT_UNSUPPORTED >&2
                      exit 1
                  fi
                  printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
    macos-private-files:
        needs: macos-mode-guard
        if: ${{ needs.macos-mode-guard.outputs.mode == 'ordinary' || needs.macos-mode-guard.outputs.mode == 'baseline' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                    - runner: macos-15
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
            EXPECTED_ARCH: ${{ matrix.arch }}
            VERIQ_MAC_EVIDENCE: ${{ github.workspace }}/.superpowers/sdd/veriq-1/evidence/t20/mac-private-fd-b/${{ github.sha }}/${{ matrix.arch }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24.x
            - name: Assert actual macOS 15 native target and record source identity
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$VERIQ_MAC_EVIDENCE"
                  sw_vers | tee "$VERIQ_MAC_EVIDENCE/os.log"
                  uname -m | tee "$VERIQ_MAC_EVIDENCE/cpu.log"
                  test "$(sw_vers -productVersion | cut -d. -f1)" = 15
                  node --input-type=module -e 'import assert from "node:assert/strict"; import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; assert.equal(process.platform,"darwin"); assert.equal(process.arch,process.env.EXPECTED_ARCH); assert.match(process.versions.node,/^24\./); const hash=p=>createHash("sha256").update(readFileSync(p)).digest("hex"); console.log(JSON.stringify({source:process.env.GITHUB_SHA,platform:process.platform,arch:process.arch,node:process.version,nodeSha256:hash(process.execPath),lockSha256:hash("pnpm-lock.yaml"),workflowSha256:hash(".github/workflows/runtime-native-macos.yml"),testsSha256:hash("apps/runtime/tests/native/darwin-private-files.test.ts"),phase:"native-private-files"},null,4));' | tee "$VERIQ_MAC_EVIDENCE/identity.json"
                  xcodebuild -version | tee "$VERIQ_MAC_EVIDENCE/xcode.log"
                  xcrun --show-sdk-version | tee "$VERIQ_MAC_EVIDENCE/sdk.log"
                  clang --version | tee "$VERIQ_MAC_EVIDENCE/clang.log"
                  python3 --version 2>&1 | tee "$VERIQ_MAC_EVIDENCE/python.log"
            - name: Install pinned tools and frozen dependencies without unrelated assets
              shell: bash
              run: |
                  set -euo pipefail
                  npm install --prefix "$RUNNER_TEMP/veriq-node-tools" pnpm@11.25.0 --ignore-scripts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/pnpm-tool.log"
                  node "$RUNNER_TEMP/veriq-node-tools/node_modules/pnpm/bin/pnpm.cjs" install --frozen-lockfile --ignore-scripts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/dependencies.log"
            - name: Build only the Darwin production and independent fault addons
              id: native_build
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node scripts/build-darwin.mjs "$RUNNER_TEMP/veriq-node-headers" --test-schedules 2>&1 | tee "$VERIQ_MAC_EVIDENCE/native-build.log"
            - name: Build standalone D1 vault members without accessing Keychain stores
              id: vault_build
              working-directory: apps/runtime
              env:
                  VERIQ_D1_BASELINE: ${{ inputs.vault_baseline || false }}
              shell: bash
              run: |
                  set -euo pipefail
                  node scripts/build-vault-darwin.mjs --tests 2>&1 | tee "$VERIQ_MAC_EVIDENCE/vault-build.log"
                  if [ "$VERIQ_D1_BASELINE" = true ]; then
                      node scripts/build-vault-darwin.mjs --red-candidate 2>&1 | tee "$VERIQ_MAC_EVIDENCE/vault-red-build.log"
                  fi
            - name: Verify only D1 protocol liveness and in-memory ACL behavior
              id: vault_tests
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node --import tsx --test tests/native/darwin-vault.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/vault-nonpersistent.log"
            - name: Inspect actual Mach-O targets and generated compilation settings
              id: native_identity
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  for target in build/darwin/veriq_private_files.node build/native-tests/veriq_private_files_fault.node; do
                      name="$(basename "$target")"
                      file "$target" | tee "$VERIQ_MAC_EVIDENCE/$name.file.log"
                      lipo -archs "$target" | tee "$VERIQ_MAC_EVIDENCE/$name.arch.log"
                      otool -l "$target" > "$VERIQ_MAC_EVIDENCE/$name.load.log"
                      otool -L "$target" | tee "$VERIQ_MAC_EVIDENCE/$name.links.log"
                  done
                  node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync, writeFileSync } from "node:fs"; import { join } from "node:path"; const root=process.env.VERIQ_MAC_EVIDENCE; const expected=process.arch==="arm64"?"arm64":"x86_64"; const settings=["veriq_private_files","veriq_private_files_fault"].map(name=>({name,settings:readFileSync("native/darwin/build/"+name+".target.mk","utf8")})); writeFileSync(join(root,"compile-settings.json"),JSON.stringify(settings,null,4)); for(const name of ["veriq_private_files.node","veriq_private_files_fault.node"]){assert.equal(readFileSync(join(root,name+".arch.log"),"utf8").trim(),expected); assert.match(readFileSync(join(root,name+".load.log"),"utf8"),/\b(?:minos|version) 15\.0(?:\.0)?\b/);} for(const item of settings){assert.match(item.settings,/-fexceptions/); assert.doesNotMatch(item.settings,/-fno-exceptions/); assert.match(item.settings,/-std=(?:gnu\+\+17|c\+\+17)/); assert.match(item.settings,/-mmacosx-version-min=15\.0/); assert.match(item.settings,/NAPI_VERSION=9/);} '
                  node --input-type=module -e 'import {createRequire} from "node:module"; const require=createRequire(import.meta.url); const addon=require("./build/darwin/veriq_private_files.node"); if(JSON.stringify(Object.keys(addon))!==JSON.stringify(["openPrivateDirectory","privateCookieFile"]))throw Error("DARWIN_PRODUCTION_EXPORTS_INVALID"); console.log(JSON.stringify({loaded:true,exports:Object.keys(addon),node:process.version,arch:process.arch}));' | tee "$VERIQ_MAC_EVIDENCE/addon-load.json"
            - name: Observe existing formal file consumers on the actual Mac target
              id: private_tests
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node --import tsx --test tests/native/darwin-private-files.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/private-files.log"
            - name: Verify Runtime strict types and concrete Node observer capability
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node "$RUNNER_TEMP/veriq-node-tools/node_modules/pnpm/bin/pnpm.cjs" check 2>&1 | tee "$VERIQ_MAC_EVIDENCE/runtime-strict.log"
                  node --import tsx --test tests/controlled-child.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/observer-capability.log"
            - name: Verify controlled command ownership independently without browsers
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node --import tsx --test tests/controlled-command.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/controlled-command.log"
            - name: Provision only pinned native source-fixture Chrome and record identity
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node node_modules/playwright-core/cli.js install chromium --no-shell 2>&1 | tee "$VERIQ_MAC_EVIDENCE/chrome-install.log"
                  node --input-type=module <<'JS' | tee "$VERIQ_MAC_EVIDENCE/chrome-identity.json"
                  import assert from "node:assert/strict";
                  import { chromium } from "playwright-core";
                  import { createRequire } from "node:module";
                  import { appendFileSync, readFileSync } from "node:fs";
                  import { createHash } from "node:crypto";
                  import { execFileSync } from "node:child_process";
                  const require = createRequire(import.meta.url);
                  const pkg = require("playwright-core/package.json");
                  const metadata = JSON.parse(readFileSync(require.resolve("playwright-core/package.json").replace(/package.json$/, "browsers.json"), "utf8"));
                  const browser = metadata.browsers.find(value => value.name === "chromium");
                  assert.equal(pkg.version, "1.65.0");
                  assert.equal(browser.revision, "1254");
                  assert.equal(browser.browserVersion, "158.0.8127.18");
                  const path = chromium.executablePath();
                  assert.match(path, /Google Chrome for Testing.app\/Contents\/MacOS\/Google Chrome for Testing$/);
                  const version = execFileSync(path, ["--version"], { encoding: "utf8" }).trim();
                  assert.match(version, /158\.0\.8127\.18/);
                  const architecture = execFileSync("lipo", ["-archs", path], { encoding: "utf8" }).trim();
                  assert.equal(architecture, process.arch === "arm64" ? "arm64" : "x86_64");
                  console.log(JSON.stringify({ source: process.env.GITHUB_SHA, boundary: "source-component-only", playwright: pkg.version, revision: browser.revision, version, path, architecture, file: execFileSync("file", [path], { encoding: "utf8" }).trim(), sha256: createHash("sha256").update(readFileSync(path)).digest("hex") }, null, 4));
                  appendFileSync(process.env.GITHUB_ENV, `VERIQ_TEST_CHROMIUM=${path}\n`);
                  JS
            - name: Verify finite controlled proof and actual Darwin ownership component
              id: controlled_process_tests
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node --import tsx --test tests/controlled-proof.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/controlled-proof.log"
                  node --import tsx --test tests/native/darwin-controlled-processes.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/controlled-processes.log"
            - name: Verify actual source business engine and decoded artifact confidentiality independently
              id: business_tests
              working-directory: apps/runtime
              shell: bash
              run: |
                  set -euo pipefail
                  node --import tsx --test --test-reporter=tap tests/native/darwin-business.test.ts 2>&1 | tee "$VERIQ_MAC_EVIDENCE/business.log"
            - name: Always bind source and actual build inputs
              if: always()
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$VERIQ_MAC_EVIDENCE"
                  node --input-type=module <<'JS'
                  import { createHash } from "node:crypto";
                  import { createReadStream, lstatSync, readdirSync, writeFileSync, existsSync } from "node:fs";
                  import { execFileSync } from "node:child_process";
                  import { createRequire } from "node:module";
                  import { join, resolve } from "node:path";
                  const inputs = [];
                  const add = async (path) => {
                      const info = lstatSync(path);
                      if (!info.isFile()) return;
                      if (inputs.length >= 4096) throw Error("MAC_BUILD_INPUT_LIMIT");
                      const digest = createHash("sha256");
                      for await (const bytes of createReadStream(path)) digest.update(bytes);
                      inputs.push({ path, bytes: info.size, sha256: digest.digest("hex") });
                  };
                  const walk = async (path) => {
                      if (!existsSync(path)) return;
                      const info = lstatSync(path);
                      if (info.isDirectory()) for (const name of readdirSync(path)) await walk(join(path, name));
                      else await add(path);
                  };
                  const source = execFileSync("git", ["ls-files", "apps/runtime/native/darwin", "apps/runtime/src/native/darwin.ts", "apps/runtime/src/node-version.ts", "apps/runtime/src/execution/processes.ts", "apps/runtime/src/execution/darwin-*", "apps/runtime/src/execution/records.ts", "apps/runtime/src/execution/stopped-history.ts", "apps/runtime/src/execution/controlled-child*", "apps/runtime/src/execution/controlled-command*", "apps/runtime/src/execution/worker.mjs", "apps/runtime/src/distribution.ts", "apps/desktop/scripts/stage-runtime.mjs", "apps/runtime/tests/controlled-proof.test.ts", "apps/runtime/tests/native/darwin-controlled-processes.test.ts", "apps/runtime/tests/fixtures/darwin-controlled-worker.mjs", "apps/runtime/tests/vault-history.test.ts", "apps/runtime/tests/controlled-command.test.ts", "apps/runtime/tests/worker-portability.test.ts", "apps/runtime/tests/distribution.test.ts", "apps/runtime/tests/native/windows-profile.test.ts", "apps/runtime/tests/fixtures/vault-distribution.ts", "apps/runtime/tests/fixtures/windows-vault.ts", "apps/runtime/tests/controlled-child.test.ts", "apps/runtime/tests/fixtures/controlled-child-owner.py", "apps/runtime/src/execution/supervisor.ts", "apps/runtime/src/execution/broker.ts", "apps/runtime/src/offline/run.ts", "apps/runtime/src/offline/config.ts", "apps/runtime/src/offline/store.ts", "apps/runtime/src/offline/verify.ts", "apps/runtime/tests/native/darwin-business.test.ts", "apps/runtime/tests/fixtures/business-engine.ts", "apps/runtime/tests/darwin-business-contract.test.ts", "apps/runtime/tests/offline-store.test.ts", "apps/runtime/tests/offline.test.ts", "apps/runtime/tests/physical.test.ts", "packages/runner-sdk/src/register-case.ts", "packages/runner-sdk/src/controlled-browser.ts", "packages/runner-sdk/src/endpoint-json-reporter.ts", "packages/runner-sdk/tests/controlled-browser.test.ts", "packages/runner-sdk/tests/queue-fixture.ts", "packages/runner-sdk/tests/distribution.ts", "packages/compiler/tests/helpers.ts", "apps/runtime/src/credentials/files.ts", "apps/runtime/scripts/build-darwin.mjs", "apps/runtime/package.json", "apps/runtime/tests/native/darwin-private-files.test.ts", "apps/runtime/tests/native/darwin-private-files-fault.cc", ".github/workflows/runtime-native-macos.yml", ".github/workflows/desktop-fix-validation.yml", "pnpm-lock.yaml", "pnpm-workspace.yaml"], {encoding:"utf8", maxBuffer:65536}).trim().split("\n").filter(Boolean);
                  for (const path of source) await add(path);
                  for (const path of ["apps/runtime/native/vault/darwin-vault.mm", "apps/runtime/native/vault/darwin-acl.hpp", "apps/runtime/scripts/build-vault-darwin.mjs", "apps/runtime/tests/native/darwin-vault.test.ts", "apps/runtime/tests/native/darwin-vault-dedicated.test.ts", "apps/runtime/tests/native/darwin-vault-controller.mm", "apps/runtime/tests/native/darwin-acl-test.mm", "apps/runtime/tests/fixtures/darwin-vault.ts"]) await add(path);
                  await add(process.execPath);
                  await walk(join(process.env.RUNNER_TEMP, "veriq-node-headers"));
                  await walk("apps/runtime/native/darwin/build");
                  await walk("apps/runtime/build/darwin");
                  await walk("apps/runtime/build/native-tests");
                  await walk("apps/runtime/build/vault-darwin");
                  await walk("apps/runtime/build/vault-darwin-test");
                  const require = createRequire(resolve("apps/runtime/package.json"));
                  try { await walk(resolve(require.resolve("node-addon-api/package.json"), "..")); }
                  catch (error) { if (error.code !== "MODULE_NOT_FOUND") throw error; }
                  writeFileSync(join(process.env.VERIQ_MAC_EVIDENCE,"source-build-inputs.json"), JSON.stringify({source:process.env.GITHUB_SHA,inputs},null,4));
                  JS
            - name: Stage bounded raw evidence and explicit segment inventory
              if: always()
              env:
                  VERIQ_MAC_UPLOAD: ${{ runner.temp }}/veriq-mac-private-upload-${{ matrix.arch }}
                  BUILD_OUTCOME: ${{ steps.native_build.outcome }}
                  TEST_OUTCOME: ${{ steps.private_tests.outcome }}
                  BUSINESS_OUTCOME: ${{ steps.business_tests.outcome }}
                  VAULT_BUILD_OUTCOME: ${{ steps.vault_build.outcome }}
                  VAULT_TEST_OUTCOME: ${{ steps.vault_tests.outcome }}
              shell: bash
              run: |
                  set -euo pipefail
                  node --input-type=module <<'JS'
                  import { mkdirSync, readdirSync, lstatSync, openSync, readSync, closeSync, writeFileSync, existsSync } from "node:fs";
                  import { createHash } from "node:crypto";
                  import { join } from "node:path";
                  const destination = process.env.VERIQ_MAC_UPLOAD;
                  // 完整日志先检查安全计数中的阳性结果，任何命中都在创建上传目录之前阻断；该门禁不把预期 JSON 交付负例的 partial/unreached 当作完整保密通过，也不复制任何私密 artifact 正文。
                  const businessLog = join(process.env.VERIQ_MAC_EVIDENCE,"business.log");
                  if (existsSync(businessLog)) {
                      const businessFd = openSync(businessLog,"r");
                      try {
                          const chunk = Buffer.alloc(65536);
                          let position = 0, pending = "";
                          while (true) {
                              const count = readSync(businessFd,chunk,0,chunk.length,position);
                              if (!count) break;
                              position += count;
                              pending += chunk.subarray(0,count).toString("utf8");
                              const lines = pending.split("\n"); pending = lines.pop();
                              for (const line of lines) {
                                  const match = line.match(/^\s*(?:#\s*)?(\{"endpointScan":.*\})\s*$/);
                                  if (match && JSON.parse(match[1]).endpointScan.hits > 0) throw Error("MAC_PRIVATE_ENDPOINT_LEAK");
                              }
                              if (pending.length > 65536) throw Error("MAC_EVIDENCE_LINE_LIMIT");
                          }
                          const match = pending.match(/^\s*(?:#\s*)?(\{"endpointScan":.*\})\s*$/);
                          if (match && JSON.parse(match[1]).endpointScan.hits > 0) throw Error("MAC_PRIVATE_ENDPOINT_LEAK");
                      } finally { closeSync(businessFd); }
                  }
                  mkdirSync(destination, {recursive:true,mode:0o700});
                  const files = readdirSync(process.env.VERIQ_MAC_EVIDENCE).sort();
                  if (files.length > 48) throw Error("MAC_EVIDENCE_FILE_LIMIT");
                  const inventory = [];
                  let total = 0;
                  for (const name of files) {
                      const path = join(process.env.VERIQ_MAC_EVIDENCE,name), info = lstatSync(path);
                      if (!info.isFile() || !/^[a-zA-Z0-9._-]+$/.test(name)) throw Error("MAC_EVIDENCE_TYPE_INVALID");
                      const segments = info.size <= 2097152 ? [[name,0,info.size]] : [[name+".first-segment",0,1048576],[name+".last-segment",info.size-1048576,1048576]];
                      const fd = openSync(path,"r");
                      try {
                          const scan = Buffer.alloc(65536);
                          let position = 0, tail = "";
                          while (position < info.size) {
                              const count = readSync(fd,scan,0,Math.min(scan.length,info.size-position),position);
                              if (!count) throw Error("MAC_EVIDENCE_SHORT_READ");
                              const text = tail + scan.subarray(0,count).toString("utf8");
                              if (/wss?:\/\/(?:127\.0\.0\.1|localhost|\[::1\]):[0-9]+\/[a-zA-Z0-9_-]{8,}/.test(text)) throw Error("MAC_PRIVATE_ENDPOINT_LEAK");
                              tail = text.slice(-512);
                              position += count;
                          }
                          for (const [output,offset,length] of segments) {
                              total += length;
                              if (total > 16777216) throw Error("MAC_EVIDENCE_TOTAL_LIMIT");
                              const bytes = Buffer.alloc(length);
                              let read = 0;
                              while (read < length) {
                                  const count = readSync(fd,bytes,read,length-read,offset+read);
                                  if (!count) throw Error("MAC_EVIDENCE_SHORT_READ");
                                  read += count;
                              }
                              writeFileSync(join(destination,output),bytes,{mode:0o600,flag:"wx"});
                              inventory.push({original:name,originalBytes:info.size,output,offset,length,segmented:info.size>2097152,sha256:createHash("sha256").update(bytes).digest("hex")});
                          }
                      } finally { closeSync(fd); }
                  }
                  writeFileSync(join(destination,"inventory.json"),JSON.stringify({source:process.env.GITHUB_SHA,arch:process.env.EXPECTED_ARCH,build:process.env.BUILD_OUTCOME,tests:process.env.TEST_OUTCOME,business:process.env.BUSINESS_OUTCOME,vaultBuild:process.env.VAULT_BUILD_OUTCOME,vaultNonpersistentTests:process.env.VAULT_TEST_OUTCOME,vaultPersistentAcceptance:"PENDING_DEDICATED_SESSION",businessExpected:26,mandatoryScanLabels:["ONLINE_ASSERT_FAIL_PASS","ONLINE_CONNECT_FAIL","OFFLINE_PASS","OFFLINE_ASSERT_FAIL","OFFLINE_CONNECT_FAIL"],intentionalGateLabels:["ONLINE_JSON_INVALID","OFFLINE_JSON_INVALID"],nativeStdio:"IGNORED",inventory},null,4));
                  JS
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              if: always()
              with:
                  name: runtime-private-macos-${{ matrix.arch }}-${{ github.sha }}
                  path: ${{ runner.temp }}/veriq-mac-private-upload-${{ matrix.arch }}/*
                  include-hidden-files: true
                  if-no-files-found: warn

    # VeriQ 会话预检以独立手动任务隔离诊断产物，两个架构只观察既有控制器的安全会话谓词；该输入不授权持久钥匙串操作，也不能推导真实图形登录完成或账户可丢弃。
    macos-session-preflight:
        needs: macos-mode-guard
        if: ${{ needs.macos-mode-guard.outputs.mode == 'preflight' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                    - runner: macos-15
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 15
        env:
            ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
            EXPECTED_ARCH: ${{ matrix.arch }}
        steps:
            # 检出和工具安装之前直接读取可信工作流提供的真实运行器上下文，拒绝自托管环境及混合手动目的；初始化的失败报告保证后续步骤未完成时仍不会留下误导性的成功事实。
            - name: Require hosted context and exclusive read-only purpose before checkout
              env:
                  VERIQ_RUNNER_ENVIRONMENT: ${{ runner.environment }}
                  VERIQ_SESSION_EVIDENCE: ${{ runner.temp }}/veriq-session-preflight-${{ matrix.arch }}
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -m 700 -p "$VERIQ_SESSION_EVIDENCE"
                  printf 'VERIQ_SESSION_EVIDENCE=%s\n' "$VERIQ_SESSION_EVIDENCE" >> "$GITHUB_ENV"
                  printf '%s\n' '{"purpose":"SESSION_FACTS_ONLY","persistentOperations":"NOT_RUN","persistentAcceptance":"NOT_EXECUTED","consoleLoginCompletion":"NOT_PROVEN","accountDisposability":"NOT_ATTESTED","tests":"NOT_RUN","securitySessionGuardPassed":false,"error":"PREFLIGHT_NOT_COMPLETED"}' > "$VERIQ_SESSION_EVIDENCE/session-report.json"
