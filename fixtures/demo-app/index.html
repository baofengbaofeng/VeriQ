<!doctype html>
<html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VeriQ employee demo</title>
    <main data-testid="employee.page">
        <h1>Employees</h1>
        <form data-testid="employee.form">
            <label for="name">Name</label>
            <input id="name" name="name" data-testid="name" maxlength="160" required>
            <button type="submit" data-testid="save">Save</button>
        </form>
        <p role="status" data-testid="result" aria-live="polite"></p>
        <table data-testid="employee.table">
            <caption>Persisted employees</caption>
            <thead><tr><th>Name</th></tr></thead>
            <tbody></tbody>
        </table>
    </main>
    <script type="module" src="/demo.js"></script>
</html>
