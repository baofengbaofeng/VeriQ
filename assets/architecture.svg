                <text x="525" y="451" fill="#eefaf9" font-size="22">经认证联网 · 领取 / 心跳 / 回报</text>
                <text x="226" y="634">独立部署</text>
                <text x="576" y="634">独立 Runtime</text>
                <text x="902" y="634">图形界面</text>
                <text x="743" y="609" fill="#115a60" font-size="18">受限本机 IPC</text>
                <text x="530" y="781" fill="#e0f4f2">云端与本机共用编译器 / Runner SDK</text>
                <text x="377" y="959" fill="#172a42" font-size="23" font-weight="700">被测前端与业务 API</text>
                <text x="855" y="959" fill="#172a42" font-size="23" font-weight="700">fixture 服务</text>
            </g>
        </g>
        <text x="872" y="864" fill="#115a60" font-size="17">HTTP 夹具调用</text>
    </g>
</svg>
