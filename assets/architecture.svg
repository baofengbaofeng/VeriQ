<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1036" viewBox="0 0 1080 1036" role="img" aria-labelledby="title description" lang="zh-CN">
    <title id="title">VeriQ 架构与运行方式</title>
    <desc id="description">React Web 管理台和外部调度接入 Tornado 控制面。控制面管理 MySQL 与本地文件或 S3 存储，访问获批 HTTP 数据源与可选模型服务。云端 Runtime 和桌面配套的本地 Agent 通过认证连接领取任务、发送心跳并回报。Electron 与本机后台之间使用受限 IPC，浏览器测试由 Runtime 执行。两种 Runtime 共用独立的 Node.js 24、编译器和 Runner SDK，借助 Playwright 和测试浏览器访问被测系统，并通过 HTTP 调用 fixture 服务。</desc>
