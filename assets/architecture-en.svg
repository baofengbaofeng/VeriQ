<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1036" viewBox="0 0 1080 1036" role="img" aria-labelledby="title description" lang="en">
    <title id="title">VeriQ architecture and runtime</title>
    <desc id="description">The React web console and external scheduler connect to the Tornado control plane. The control plane manages MySQL and local file or S3 storage, and accesses approved HTTP data sources and optional model providers. The cloud runtime and the desktop’s local Agent use authenticated connections to claim jobs, send heartbeats, and report results. The Electron desktop uses restricted local IPC. Both runtimes share an independent Node.js 24 engine, compiler, and Runner SDK. The runtimes use Playwright and the test browser to exercise the system under test and call the fixture service over HTTP.</desc>
