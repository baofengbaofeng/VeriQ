        <circle cx="530" cy="694" r="4"/>
        <path d="M 756 185 L 766 190 L 756 195 Z M 756 239 L 766 244 L 756 249 Z M 756 293 L 766 298 L 756 303 Z M 756 347 L 766 352 L 756 357 Z"/>
    </g>

    <g fill="#fff" stroke="#a9bacc" stroke-width="2">
        <rect x="64" y="174" width="227" height="74" rx="12"/>
        <rect x="64" y="269" width="227" height="74" rx="12"/>
        <rect x="766" y="168" width="250" height="44" rx="10"/>
        <rect x="766" y="222" width="250" height="44" rx="10"/>
        <rect x="766" y="276" width="250" height="44" rx="10"/>
        <rect x="766" y="330" width="250" height="44" rx="10"/>
    </g>
    <rect x="351" y="213" width="337" height="113" rx="14" fill="#293c59"/>
    <rect x="291" y="422" width="468" height="45" rx="22.5" fill="#22354a" stroke="#68cfc3" stroke-width="1.5"/>

    <g fill="#fff" stroke="#91c0bb" stroke-width="2">
        <rect x="64" y="568" width="324" height="86" rx="13"/>
        <rect x="476" y="568" width="200" height="86" rx="13"/>
        <rect x="810" y="568" width="184" height="86" rx="13"/>
        <rect x="124" y="832" width="506" height="67" rx="13"/>
        <rect x="124" y="927" width="506" height="49" rx="12"/>
        <rect x="694" y="927" width="322" height="49" rx="12"/>
    </g>
    <rect x="273" y="715" width="514" height="86" rx="14" fill="#115a60"/>

    <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif" fill="#172a42">
        <text x="61" y="72" fill="#68cfc3" font-size="32" font-weight="700">VeriQ</text>
        <text x="167" y="72" fill="#f0f6ff" font-size="32" font-weight="700">アーキテクチャと実行構成</text>
        <text x="64" y="149" font-size="27" font-weight="700">コントロールプレーン</text>
        <text x="64" y="526" fill="#115a60" font-size="27" font-weight="700">実行プレーン</text>

        <g text-anchor="middle">
            <g font-size="24" font-weight="700">
                <text x="177.5" y="205">Web 管理画面</text>
                <text x="177.5" y="300" font-size="20">外部スケジューラ / CI</text>
