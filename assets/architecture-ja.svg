                <text x="377" y="873">Playwright Test とテスト用ブラウザ</text>
            </g>
            <g font-size="20" fill="#365164">
                <text x="177.5" y="230">React</text>
                <text x="177.5" y="325" font-size="17">認証付き HTTP トリガー</text>
                <text x="519.5" y="282" fill="#e1efff">制御 API と静的サイト</text>
                <text x="519.5" y="306" fill="#e1efff" font-size="18">認証・認可とキュー管理</text>
                <text x="891" y="197">MySQL データベース</text>
                <text x="891" y="251" font-size="16">ローカルファイル / S3 成果物</text>
                <text x="891" y="305" font-size="17">承認済み HTTP データソース</text>
                <text x="891" y="359">モデルサービス（任意）</text>
                <text x="525" y="451" fill="#eefaf9" font-size="17">認証済み接続 · タスク取得 / ハートビート / 結果報告</text>
                <text x="226" y="634">独立してデプロイ</text>
                <text x="576" y="634">独立ランタイム</text>
                <text x="902" y="634">グラフィカル UI</text>
                <text x="743" y="594" fill="#115a60" font-size="16"><tspan x="743">制限付き</tspan><tspan x="743" dy="19">ローカル IPC</tspan></text>
                <text x="530" y="781" fill="#e0f4f2">コンパイラと Runner SDK を共用</text>
                <text x="377" y="959" fill="#172a42" font-size="23" font-weight="700">テスト対象のフロントエンドと業務 API</text>
                <text x="855" y="959" fill="#172a42" font-size="23" font-weight="700">フィクスチャサービス</text>
            </g>
        </g>
        <text x="872" y="864" fill="#115a60" font-size="16">HTTP 呼び出し</text>
    </g>
</svg>
