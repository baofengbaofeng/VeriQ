<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1036" viewBox="0 0 1080 1036" role="img" aria-labelledby="title description" lang="ja">
    <title id="title">VeriQ のアーキテクチャと実行構成</title>
    <desc id="description">React の Web 管理画面と外部スケジューラは、Tornado のコントロールプレーンに接続します。コントロールプレーンは MySQL とローカルファイルまたは S3 のストレージを管理し、承認済みの HTTP データソースと必要に応じてモデルサービスにアクセスします。クラウドとデスクトップのローカル Agent は、認証済みの接続でタスクを取得し、ハートビートと結果を送信します。Electron デスクトップとローカル Agent の間は、制限付きのローカル IPC を使います。両方のランタイムは独立した Node.js 24、コンパイラ、Runner SDK を共有します。Playwright とテスト用ブラウザで対象システムを操作し、フィクスチャサービスは HTTP で呼び出します。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 1 1 L 9 5 L 1 9" fill="#237276"/>
        </marker>
    </defs>

    <rect width="1080" height="1036" rx="30" fill="#121e31"/>
    <rect x="36" y="106" width="1008" height="296" rx="20" fill="#eaf1f8"/>
