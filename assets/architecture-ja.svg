        <path d="M 688 267 H 727 M 727 190 V 352"/>
        <path d="M 727 190 H 764 M 727 244 H 764 M 727 298 H 764 M 727 352 H 764"/>
        <path d="M 525 326 V 535 H 226 V 568 M 525 535 H 576 V 568" marker-start="url(#arrow)"/>
        <path d="M 676 625 H 810" stroke-dasharray="5 6"/>
        <path d="M 226 654 V 694 H 530 M 576 654 V 694 H 530 V 715" marker-end="url(#arrow)"/>
